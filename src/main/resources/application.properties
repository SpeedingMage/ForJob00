server.port=8080

# DeepSeek v4-flash (OpenAI 兼容接口)
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY:your-deepseek-api-key}
langchain4j.open-ai.chat-model.model-name=deepseek-v4-flash
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# Supabase 配置
supabase.url=${SUPABASE_URL:http://localhost:54321}
supabase.api.key=${SUPABASE_API_KEY:your-supabase-service-role-key}
